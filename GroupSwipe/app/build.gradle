plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.google.gms.google-services'
    id 'com.google.dagger.hilt.android'
    id 'com.google.devtools.ksp'
    id 'kotlin-parcelize'
}


def localProps = new Properties()
def localPropsFile = rootProject.file("local.properties")
if (localPropsFile.exists()) {
    localPropsFile.withInputStream { localProps.load(it) }
}
def secret = { String key -> "\"${localProps.getProperty(key, "")}\"" }

android {
    namespace 'com.groupswipe'
    compileSdk 35

    defaultConfig {
        applicationId "com.groupswipe"
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables { useSupportLibrary true }

        // =================================================================================
        // KLUCZE API – czytane z local.properties (NIE wpisuj ich tutaj na sztywno!)
        // Wartości uzupełnij w pliku local.properties wg local.properties.template
        // =================================================================================

        // 1. The Movie Database (TMDB) - https://www.themoviedb.org/settings/api
        buildConfigField "String", "TMDB_API_KEY",          secret("TMDB_API_KEY")
        buildConfigField "String", "TMDB_BASE_URL",         "\"https://api.themoviedb.org/3/\""
        buildConfigField "String", "TMDB_IMAGE_BASE_URL",   "\"https://image.tmdb.org/t/p/w500\""

        // 2. Foursquare Places API - https://docs.foursquare.com/fsq-developers-places
        buildConfigField "String", "FOURSQUARE_SERVICE_KEY", secret("FOURSQUARE_SERVICE_KEY")
        buildConfigField "String", "FOURSQUARE_API_VERSION", "\"2025-06-17\""
        // (pozostawione dla zgodności; nieużywane przez nowe API)
        buildConfigField "String", "FOURSQUARE_API_KEY",     secret("FOURSQUARE_API_KEY")

        // 3. OpenTripMap - https://opentripmap.io/product
        buildConfigField "String", "OPENTRIPMAP_API_KEY",   secret("OPENTRIPMAP_API_KEY")
        buildConfigField "String", "OPENTRIPMAP_BASE_URL",  "\"https://api.opentripmap.com/\""

        // 4. Ticketmaster API - https://developer.ticketmaster.com/
        buildConfigField "String", "TICKETMASTER_API_KEY",  secret("TICKETMASTER_API_KEY")

        // =================================================================================
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
    buildFeatures {
        compose true
        buildConfig true
    }
    composeOptions { kotlinCompilerExtensionVersion '1.5.8' }
    packaging { resources { excludes += '/META-INF/{AL2.0,LGPL2.1}' } }
}

dependencies {
    // --- Compose BOM ---
    def composeBom = platform('androidx.compose:compose-bom:2024.12.01')
    implementation composeBom
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.compose.animation:animation'
    implementation 'androidx.compose.foundation:foundation'
    debugImplementation 'androidx.compose.ui:ui-tooling'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'

    // --- Core Android ---
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.7'
    implementation 'androidx.activity:activity-compose:1.9.3'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.8.7'
    implementation 'androidx.core:core-splashscreen:1.0.1'

    // --- Navigation ---
    implementation "androidx.navigation:navigation-compose:2.8.5"

    // --- Hilt DI ---
    implementation "com.google.dagger:hilt-android:2.51.1"
    ksp "com.google.dagger:hilt-compiler:2.51.1"
    implementation 'androidx.hilt:hilt-navigation-compose:1.2.0'

    // --- Firebase BOM ---
    implementation platform('com.google.firebase:firebase-bom:33.7.0')
    implementation 'com.google.firebase:firebase-auth'
    implementation 'com.google.firebase:firebase-firestore'
    implementation 'com.google.firebase:firebase-analytics'

    // --- Room ---
    def roomVersion = '2.6.1'
    implementation "androidx.room:room-runtime:$roomVersion"
    implementation "androidx.room:room-ktx:$roomVersion"
    ksp "androidx.room:room-compiler:$roomVersion"

    // --- Retrofit + OkHttp ---
    implementation 'com.squareup.retrofit2:retrofit:2.11.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.11.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'

    // --- Coil ---
    implementation "io.coil-kt:coil-compose:2.7.0"

    // --- Coroutines ---
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-play-services:1.9.0'

    // --- DataStore ---
    implementation "androidx.datastore:datastore-preferences:1.1.1"

    // --- Location ---
    implementation 'com.google.android.gms:play-services-location:21.3.0'

    // --- Testy ---
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
    androidTestImplementation composeBom
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
}